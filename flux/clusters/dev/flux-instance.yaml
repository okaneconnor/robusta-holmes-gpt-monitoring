apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"

  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller

  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: "cluster.local"

  sync:
    kind: GitRepository
    url: "YOUR_GITHUB_REPOSITORY_URL" # TODO: Replace this with your GitHub repository URL (e.g., https://github.com/username/robusta-alerting-automation)
    ref: "refs/heads/main"
    path: "flux/clusters/dev"
    pullSecret: "flux-system"
    interval: 1m
    provider: github
