apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: holmesgpt
  namespace: flux-system
spec:
  interval: 5m
  path: ./flux/apps/holmesgpt
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: holmesgpt
      namespace: holmesgpt
