apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: robusta
  namespace: robusta
spec:
  interval: 5m
  chart:
    spec:
      chart: robusta
      version: '>=0.10.29'
      sourceRef:
        kind: HelmRepository
        name: robusta
        namespace: robusta
      interval: 1m

  valuesFrom:
    - kind: ConfigMap
      name: robusta-values
      valuesKey: values.yaml
    - kind: Secret
      name: robusta-slack-token
      valuesKey: slack-api-key
      targetPath: sinksConfig[0].slack_sink.api_key

  install:
    remediation:
      retries: 3
    crds: CreateReplace

  upgrade:
    remediation:
      retries: 3
    crds: CreateReplace

  rollback:
    recreate: true
