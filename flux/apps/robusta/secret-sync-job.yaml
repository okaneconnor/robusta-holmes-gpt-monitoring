apiVersion: batch/v1
kind: Job
metadata:
  name: keyvault-secret-sync
  namespace: robusta
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: robusta-sa
      restartPolicy: Never
      containers:
      - name: secret-sync
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          echo "Mounting Azure Key Vault secrets via CSI driver..."
          ls -la /mnt/secrets-store/
          echo "Secret sync complete!"
          sleep 10
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: robusta-keyvault-sync
  backoffLimit: 3
