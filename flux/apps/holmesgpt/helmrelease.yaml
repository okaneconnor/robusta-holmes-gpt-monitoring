apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: holmesgpt
  namespace: holmesgpt
spec:
  interval: 5m
  chart:
    spec:
      chart: holmes
      version: ">=0.1.0"
      sourceRef:
        kind: HelmRepository
        name: robusta
        namespace: holmesgpt
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: holmesgpt-values
      valuesKey: values.yaml
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
