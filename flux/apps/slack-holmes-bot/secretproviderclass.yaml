apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: slack-holmes-bot-keyvault-sync
  namespace: slack-holmes-bot
spec:
  provider: azure

  secretObjects:
    - secretName: slack-holmes-bot-tokens
      type: Opaque
      data:
        - objectName: holmes-bot-secret-token
          key: slack-bot-token
        - objectName: holmes-app-token
          key: slack-app-token

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "YOUR_WORKLOAD_IDENTITY_CLIENT_ID" # TODO: Replace this with your workload identity client ID (output from Terraform)

    keyvaultName: "YOUR_KEYVAULT_NAME" # TODO: Replace this with your Key Vault name (output from Terraform, e.g., kv-robusta-dev)
    tenantId: "YOUR_AZURE_TENANT_ID" # TODO: Replace this with your Azure tenant ID

    objects: |
      array:
        - |
          objectName: holmes-bot-secret-token
          objectType: secret
          objectVersion: ""
        - |
          objectName: holmes-app-token
          objectType: secret
          objectVersion: ""
