apiVersion: batch/v1
kind: Job
metadata:
  name: keyvault-secret-sync
  namespace: slack-holmes-bot
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: slack-holmes-bot-sa
      containers:
      - name: secret-sync
        image: busybox:latest
        command: ["sh", "-c", "echo 'Secrets synced from Key Vault' && sleep 10"]
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: slack-holmes-bot-keyvault-sync
      restartPolicy: OnFailure
