parameters:
  - name: serviceConnection
    type: string
  - name: env_path
    type: string
  - name: subscriptionId
    type: string
  - name: terraformVersion
    type: string
    default: 'latest'
  - name: workingDirectory
    type: string
  - name: backend_storageaccount
    type: string
  - name: backend_statefile
    type: string
  - name: job_name
    type: string
    default: 'terraform_destroy'
  - name: DependsOn
    type: object
    default: []
jobs:
- job: '${{ parameters.job_name }}'
  displayName: Terraform Destroy ('${{ parameters.job_name }}')
  dependsOn: ${{ parameters.DependsOn }}
  steps:
  # Explicitly checkout the repository
  - checkout: self
    displayName: 'checkout repository'

  - task: TerraformInstaller@1
    displayName: install terraform
    inputs:
      terraformVersion: ${{ parameters.terraformVersion }}

  # Run all Terraform commands in a single AzureCLI task to maintain authentication context
  - task: AzureCLI@2
    displayName: 'Terraform Init and Destroy'
    condition: and(succeeded(), eq(variables['action'], 'Destroy'))
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      addSpnToEnvironment: true
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      workingDirectory: '${{ parameters.workingDirectory }}'
      inlineScript: |
        set -e  # Exit on any error

        echo "Setting ARM environment variables..."
        export ARM_CLIENT_ID=$servicePrincipalId
        export ARM_CLIENT_SECRET=$servicePrincipalKey
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        export ARM_TENANT_ID=$tenantId

        echo "ARM_CLIENT_ID: $ARM_CLIENT_ID"
        echo "ARM_TENANT_ID: $ARM_TENANT_ID"
        echo "ARM_SUBSCRIPTION_ID: $ARM_SUBSCRIPTION_ID"

        echo ""
        echo "=== Terraform Init ==="
        # TODO: Replace this with your Terraform backend resource group name
        terraform init \
          -backend-config="resource_group_name=YOUR_BACKEND_RESOURCE_GROUP" \
          -backend-config="storage_account_name=${{ parameters.backend_storageaccount }}" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=${{ parameters.backend_statefile }}" \
          -backend-config="use_azuread_auth=true"

        echo ""
        echo "=== Terraform Destroy ==="
        terraform destroy \
          -var-file=${{ parameters.env_path }}/terraform.tfvars \
          -input=false \
          -auto-approve
